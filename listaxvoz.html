<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lista x Voz</title>
    <style>
        /* --- ESTILOS DE ALTO CONTRASTE PARA CAMPO --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #FFFFFF;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #7FFF00;
            padding-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            color: #FFFFFF;
            font-weight: bold;
        }

        /* --- PERFIL DE USUARIO --- */
        .btn-perfil {
            background: none;
            border: none;
            font-size: 32px;
            cursor: pointer;
            padding: 5px;
        }

        #modal-perfil {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            border: 3px solid #7FFF00;
            padding: 20px;
            border-radius: 10px;
            background-color: #111111;
        }

        .modal-content h2 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #7FFF00;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            background-color: #222222;
            border: 2px solid #FFFFFF;
            color: #FFFFFF;
            border-radius: 5px;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #7FFF00;
            outline: none;
        }

        .form-group textarea {
            height: 100px;
            resize: none;
        }

        /* --- ENCABEZADO DINÁMICO EN LA LISTA --- */
        #header-cliente {
            margin-bottom: 15px;
            font-size: 16px;
            line-height: 1.4;
            border-left: 4px solid #7FFF00;
            padding-left: 10px;
            display: none;
        }

        #logo-preview {
            max-width: 80px;
            max-height: 80px;
            display: none;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        /* --- FLUJO DE DICTADO --- */
        #indicador-paso {
            font-size: 20px;
            color: #7FFF00;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
        }

        #titulo-lista-actual {
            font-size: 24px;
            text-align: center;
            margin-bottom: 15px;
            color: #FFFFFF;
            border-bottom: 1px dashed #555555;
            padding-bottom: 5px;
            display: none;
        }

        /* Botón de Micrófono Gigante */
        .contenedor-mic {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        .btn-mic {
            background-color: #7FFF00;
            border: none;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(127, 255, 0, 0.4);
            transition: transform 0.1s ease;
        }

        .btn-mic:active {
            transform: scale(0.9);
        }

        .btn-mic.escuchando {
            background-color: #FF3B30;
            animation: pulso 1.2s infinite;
        }

        .btn-mic svg {
            width: 50px;
            height: 50px;
            fill: #000000;
        }

        .btn-mic.escuchando svg {
            fill: #FFFFFF;
        }

        @keyframes pulso {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        /* --- PANTALLAS DE TEXTO --- */
        #transcripcion-tiempo-real {
            font-size: 22px;
            color: #A0A0A0;
            font-style: italic;
            text-align: center;
            min-height: 40px;
            margin-bottom: 20px;
            padding: 10px;
        }

        #contenedor-resultado {
            background-color: #111111;
            border: 2px solid #333333;
            border-radius: 8px;
            padding: 15px;
            flex-grow: 1;
            margin-bottom: 20px;
        }

        /* Checklist con Dedos Grandes */
        .item-material {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding: 8px 0;
        }

        .item-material input[type="checkbox"] {
            width: 28px;
            height: 28px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: #7FFF00;
        }

        .item-material label {
            font-size: 20px;
            color: #FFFFFF;
            cursor: pointer;
            user-select: none;
        }

        .item-material input[type="checkbox"]:checked + label {
            text-decoration: line-through;
            color: #666666;
        }

        /* --- ACCIONES GIGANTES --- */
        .btn-accion {
            background-color: #7FFF00;
            color: #000000;
            font-size: 20px;
            font-weight: bold;
            border: none;
            padding: 18px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-secundario {
            background-color: transparent;
            border: 2px solid #FFFFFF;
            color: #FFFFFF;
            margin-top: 15px;
            padding: 12px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Lista x Voz</h1>
        <button class="btn-perfil" onclick="abrirPerfil()" aria-label="Perfil de usuario">👤</button>
    </header>

    <div id="indicador-paso">Paso 1: Dictá el Nombre de la Lista</div>
    <div id="titulo-lista-actual"></div>

    <div id="contenedor-resultado">
        <div id="header-cliente">
            <img id="logo-preview" src="" alt="Logo">
            <div id="datos-cliente-texto"></div>
        </div>
        
        <div id="lista-materiales-checklist"></div>
    </div>

    <div id="transcripcion-tiempo-real">Presioná el micrófono para hablar...</div>

    <div class="contenedor-mic">
        <button id="btn-grabar" class="btn-mic" onclick="alternarDictado()">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
            </svg>
        </button>
    </div>

    <button id="btn-whatsapp" class="btn-accion" onclick="enviarWhatsApp()" style="display: none;">
        💬 Enviar a la Ferretería por WhatsApp
    </button>

    <button id="btn-reiniciar" class="btn-accion btn-secundario" onclick="reiniciarFlujo()" style="display: none;">
        Nueva Lista / Borrar
    </button>

    <div id="modal-perfil">
        <div class="modal-content">
            <h2>Perfil de Trabajo</h2>
            
            <div class="form-group">
                <label>Subir Logo:</label>
                <input type="file" id="p-logo" accept="image/*" onchange="procesarLogo(this)">
            </div>
            <div class="form-group">
                <label>Nombre / Empresa:</label>
                <input type="text" id="p-nombre" placeholder="Ej: Plomería Juan">
            </div>
            <div class="form-group">
                <label>📱 Teléfono Celular:</label>
                <input type="tel" id="p-telefono" placeholder="Ej: 1123456789 (Solo números)">
            </div>
            <div class="form-group">
                <label>✉️ Mail de contacto:</label>
                <input type="email" id="p-mail" placeholder="ejemplo@correo.com">
            </div>
            <div class="form-group">
                <label>📄 ID Fiscal (CUIT / RUT / etc):</label>
                <input type="text" id="p-fiscal" placeholder="Ej: CUIT 20-XXXXXXXX-0">
            </div>
            <div class="form-group">
                <label>📝 Información Adicional (Web, Redes):</label>
                <textarea id="p-adicional" placeholder="Dirección del taller, redes sociales, etc."></textarea>
            </div>

            <button class="btn-accion" onclick="guardarPerfil()">Guardar Perfil</button>
            <button class="btn-accion btn-secundario" onclick="cerrarPerfil()">Cancelar</button>
        </div>
    </div>

    <script>
        // Variables de estado del flujo
        let pasoActual = 1; // 1 = Nombre de Lista, 2 = Materiales, 3 = Terminada
        let nombreLista = "";
        let itemsLista = [];
        let escuchando = false;

        // Configuración de Reconocimiento de Voz Nativo
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let reconocimiento;
        
        if (SpeechRecognition) {
            reconocimiento = new SpeechRecognition();
            reconocimiento.continuous = true; // Sigue escuchando aunque haya pausas breves
            reconocimiento.interimResults = true; // Muestra resultados intermedios en tiempo real
            reconocimiento.lang = 'es-AR'; // Optimizado para español regional

            reconocimiento.onresult = (event) => {
                let textoIntermedio = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        procesarEntradaVoz(event.results[i][0].transcript);
                    } else {
                        textoIntermedio += event.results[i][0].transcript;
                    }
                }
                if (textoIntermedio) {
                    document.getElementById('transcripcion-tiempo-real').innerText = textoIntermedio;
                }
            };

            reconocimiento.onerror = (event) => {
                console.error("Error de reconocimiento:", event.error);
                if (event.error === 'not-allowed') {
                    alert("Por favor, permití el acceso al micrófono para usar la app.");
                }
            };

            reconocimiento.onend = () => {
                // Si se corta de golpe pero el flag sigue activo, fuerza el reinicio sin volver a pedir permisos desde cero
                if (escuchando) {
                    reconocimiento.start();
                }
            };
        } else {
            alert("Tu navegador o dispositivo móvil no soporta reconocimiento de voz integrado de manera directa.");
        }

        // CONTROL DE FLUJO POR BOTÓN GIGANTE
        function alternarDictado() {
            if (!reconocimiento) return;

            if (!escuchando) {
                // Encender micrófono
                escuchando = true;
                document.getElementById('btn-grabar').classList.add('escuchando');
                document.getElementById('transcripcion-tiempo-real').innerText = "Escuchando... hablá ahora.";
                reconocimiento.start(); // El navegador pedirá permiso la PRIMERA vez únicamente.
            } else {
                // Apagar micrófono manualmente y procesar
                apagarMicrofono();
            }
        }

        function apagarMicrofono() {
            escuchando = false;
            document.getElementById('btn-grabar').classList.remove('escuchando');
            if (reconocimiento) {
                reconocimiento.stop();
            }
            document.getElementById('transcripcion-tiempo-real').innerText = "Presioná el micrófono para hablar...";
        }

        function procesarEntradaVoz(texto) {
            texto = texto.trim();
            if (!texto) return;

            if (pasoActual === 1) {
                // Guardamos el título de la lista
                nombreLista = texto;
                document.getElementById('titulo-lista-actual').innerText = "📋 " + nombreLista;
                document.getElementById('titulo-lista-actual').style.display = "block";
                
                // Pasamos al paso 2
                pasoActual = 2;
                document.getElementById('indicador-paso').innerText = "Paso 2: Dictá los Materiales (De corrido)";
                apagarMicrofono(); // Le damos un respiro para que el usuario se prepare para los materiales
            } else if (pasoActual === 2) {
                // Filtramos palabras de conexión comunes que la gente dice al dictar de corrido
                // Separamos por comas, conectores ("y", "también") o saltos lógicos
                let nuevosItems = texto.split(/,|\by\b|\btambién\b|\bcon\b/i);
                
                nuevosItems.forEach(item => {
                    let limpio = item.trim();
                    // Limpieza básica de letras sueltas y mayúscula inicial
                    if (limpio.length > 1) {
                        limpio = limpio.charAt(0).toUpperCase() + limpio.slice(1);
                        itemsLista.push(limpio);
                    }
                });

                renderizarListaChecklist();
                document.getElementById('btn-whatsapp').style.display = "flex";
                document.getElementById('btn-reiniciar').style.display = "flex";
            }
        }

        // RENDERIZADOR DE LA LISTA EN PANTALLA
        function renderizarListaChecklist() {
            const contenedor = document.getElementById('lista-materiales-checklist');
            contenedor.innerHTML = ""; // Limpiar pantalla previa

            itemsLista.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'item-material';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `item-${index}`;

                const label = document.createElement('label');
                label.htmlFor = `item-${index}`;
                label.innerText = item;

                div.appendChild(checkbox);
                div.appendChild(label);
                contenedor.appendChild(div);
            });
        }

        // ACCIÓN: COMPARTIR DIRECTO A WHATSAPP
        function enviarWhatsApp() {
            // Re-armar el texto limpio para enviar por la API de mensajería
            let mensaje = "";
            
            // Si hay datos de perfil, los sumamos arriba de todo de forma prolija
            const perfilString = generarTextoPerfil();
            if (perfilString) {
                mensaje += perfilString + "\n---------------------\n";
            }

            mensaje += `*LISTA DE MATERIALES*\n`;
            if (nombreLista) {
                mensaje += `*Destino/Obra:* ${nombreLista}\n\n`;
            }

            itemsLista.forEach(item => {
                mensaje += `▢ ${item}\n`;
            });

            // Codificar texto para URL de WhatsApp Universal
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        // REINICIAR APP PARA OTRA CONSULTA
        function reiniciarFlujo() {
            if (confirm("¿Estás seguro de que querés borrar la lista actual para empezar una nueva?")) {
                pasoActual = 1;
                nombreLista = "";
                itemsLista = [];
                document.getElementById('titulo-lista-actual').style.display = "none";
                document.getElementById('titulo-lista-actual').innerText = "";
                document.getElementById('lista-materiales-checklist').innerHTML = "";
                document.getElementById('btn-whatsapp').style.display = "none";
                document.getElementById('btn-reiniciar').style.display = "none";
                document.getElementById('indicador-paso').innerText = "Paso 1: Dictá el Nombre de la Lista";
                apagarMicrofono();
            }
        }

        /* --- CONTROL DE PERFIL DE USUARIO (LOCAL STORAGE) --- */
        let logoBase64 = "";

        function abrirPerfil() {
            document.getElementById('modal-perfil').style.display = "block";
            // Cargar datos guardados previamente si existen
            document.getElementById('p-nombre').value = localStorage.getItem('p_nombre') || "";
            document.getElementById('p-telefono').value = localStorage.getItem('p_telefono') || "";
            document.getElementById('p-mail').value = localStorage.getItem('p_mail') || "";
            document.getElementById('p-fiscal').value = localStorage.getItem('p_fiscal') || "";
            document.getElementById('p-adicional').value = localStorage.getItem('p_adicional') || "";
            logoBase64 = localStorage.getItem('p_logo') || "";
        }

        function cerrarPerfil() {
            document.getElementById('modal-perfil').style.display = "none";
        }

        // Convierte la imagen del logo a un formato de texto almacenable en el celular
        function procesarLogo(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    logoBase64 = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function guardarPerfil() {
            localStorage.setItem('p_nombre', document.getElementById('p-nombre').value.trim());
            localStorage.setItem('p_telefono', document.getElementById('p-telefono').value.trim());
            localStorage.setItem('p_mail', document.getElementById('p-mail').value.trim());
            localStorage.setItem('p_fiscal', document.getElementById('p-fiscal').value.trim());
            localStorage.setItem('p_adicional', document.getElementById('p-adicional').value.trim());
            if (logoBase64) {
                localStorage.setItem('p_logo', logoBase64);
            }

            cerrarPerfil();
            cargarEncabezadoPerfilEnPantalla();
        }

        // Muestra los datos comerciales en la parte superior del cuadro de la lista si existen
        function cargarEncabezadoPerfilEnPantalla() {
            const nombre = localStorage.getItem('p_nombre');
            const telefono = localStorage.getItem('p_telefono');
            const mail = localStorage.getItem('p_mail');
            const fiscal = localStorage.getItem('p_fiscal');
            const adicional = localStorage.getItem('p_adicional');
            const logo = localStorage.getItem('p_logo');

            const divHeader = document.getElementById('header-cliente');
            const divTexto = document.getElementById('datos-cliente-texto');
            const imgLogo = document.getElementById('logo-preview');

            if (nombre || telefono || mail || fiscal || adicional || logo) {
                divHeader.style.display = "block";
                let HTMLdatos = "";

                if (nombre) HTMLdatos += `<strong>${nombre}</strong><br>`;
                if (telefono) HTMLdatos += `📱 Tel: ${telefono}<br>`;
                if (mail) HTMLdatos += `✉️ Msg: ${mail}<br>`;
                if (fiscal) HTMLdatos += `📄 ID: ${fiscal}<br>`;
                if (adicional) HTMLdatos += `<small>${adicional}</small>`;

                divTexto.innerHTML = HTMLdatos;

                if (logo) {
                    imgLogo.src = logo;
                    imgLogo.style.display = "block";
                } else {
                    imgLogo.style.display = "none";
                }
            } else {
                divHeader.style.display = "none";
            }
        }

        // Estructura los datos para que salgan prolijos en el mensaje de WhatsApp enviado
        function generarTextoPerfil() {
            const nombre = localStorage.getItem('p_nombre');
            const telefono = localStorage.getItem('p_telefono');
            const mail = localStorage.getItem('p_mail');
            const fiscal = localStorage.getItem('p_fiscal');
            
            let str = "";
            if (nombre) str += `*${nombre}*\n`;
            if (telefono) str += `📱 Tel: ${telefono}\n`;
            if (mail) str += `✉️ Msg: ${mail}\n`;
            if (fiscal) str += `📄 ID: ${fiscal}\n`;
            return str.trim();
        }

        // Carga inicial al abrir la app
        window.onload = function() {
            cargarEncabezadoPerfilEnPantalla();
        };
    </script>
</body>
</html>
