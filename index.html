<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lista x Voz</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* --- ESTILOS DE ALTO CONTRASTE PARA CAMPO --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #FFFFFF;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #7FFF00;
            padding-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            color: #FFFFFF;
            font-weight: bold;
        }

        /* --- PERFIL DE USUARIO --- */
        .btn-perfil {
            background: none;
            border: none;
            font-size: 32px;
            cursor: pointer;
            padding: 5px;
        }

        #modal-perfil {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.98);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            border: 3px solid #7FFF00;
            padding: 20px;
            border-radius: 10px;
            background-color: #111111;
        }

        .modal-content h2 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #7FFF00;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            background-color: #222222;
            border: 2px solid #FFFFFF;
            color: #FFFFFF;
            border-radius: 5px;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #7FFF00;
            outline: none;
        }

        .form-group textarea {
            height: 100px;
            resize: none;
        }

        /* --- CONTENEDOR DE LA HOJA EN PANTALLA --- */
        #contenedor-resultado {
            background-color: #111111;
            border: 2px solid #333333;
            border-radius: 8px;
            padding: 15px;
            flex-grow: 1;
            margin-bottom: 20px;
        }

        /* Encabezado del documento en pantalla */
        #header-cliente {
            margin-bottom: 20px;
            font-size: 16px;
            line-height: 1.4;
            border-left: 4px solid #7FFF00;
            padding-left: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #logo-preview {
            max-width: 70px;
            max-height: 70px;
            object-fit: contain;
            border-radius: 5px;
            display: none;
        }

        #indicador-paso {
            font-size: 20px;
            color: #7FFF00;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
        }

        #titulo-lista-actual {
            font-size: 24px;
            text-align: center;
            margin-bottom: 15px;
            color: #FFFFFF;
            border-bottom: 1px dashed #555555;
            padding-bottom: 5px;
            font-weight: bold;
        }

        /* --- FILAS DE MATERIALES --- */
        .item-material {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 8px 5px;
            border-bottom: 1px solid #222222;
        }

        .item-izq {
            display: flex;
            align-items: center;
            flex-grow: 1;
        }

        .item-material input[type="checkbox"] {
            width: 28px;
            height: 28px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: #7FFF00;
            flex-shrink: 0;
        }

        .item-material label {
            font-size: 20px;
            color: #FFFFFF;
            cursor: pointer;
            word-break: break-word;
        }

        .item-material input[type="checkbox"]:checked + label {
            text-decoration: line-through;
            color: #666666;
        }

        .btn-borrar-item {
            background: none;
            border: none;
            color: #FF3B30;
            font-size: 22px;
            padding: 5px 10px;
            cursor: pointer;
            margin-left: 10px;
        }

        /* --- CONTROLES DE AUDIO --- */
        .contenedor-mic {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
        }

        .btn-mic {
            background-color: #7FFF00;
            border: none;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(127, 255, 0, 0.4);
        }

        .btn-mic.escuchando {
            background-color: #FF3B30;
            animation: pulso 1.2s infinite;
        }

        .btn-mic svg {
            width: 50px;
            height: 50px;
            fill: #000000;
        }

        .btn-mic.escuchando svg {
            fill: #FFFFFF;
        }

        @keyframes pulso {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        #transcripcion-tiempo-real {
            font-size: 20px;
            color: #A0A0A0;
            font-style: italic;
            text-align: center;
            min-height: 45px;
            margin-bottom: 15px;
            padding: 5px 10px;
        }

        /* --- BOTONES DE ACCIÓN --- */
        .btn-accion {
            background-color: #7FFF00;
            color: #000000;
            font-size: 20px;
            font-weight: bold;
            border: none;
            padding: 18px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-secundario {
            background-color: transparent;
            border: 2px solid #FFFFFF;
            color: #FFFFFF;
            margin-top: 15px;
            padding: 12px;
            font-size: 16px;
        }

        /* --- 📄 ESTILOS EXCLUSIVOS PARA LA HOJA DE IMPRESIÓN PDF --- */
        #espejo-pdf-render {
            width: 794px; /* Ancho real proporcional para renderizado A4 */
            background-color: #FFFFFF !important;
            color: #000000 !important;
            padding: 40px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }

        /* Fuerza textos oscuros legibles en la hoja blanca */
        #espejo-pdf-render .pdf-texto-item { color: #000000 !important; }
        #espejo-pdf-render .pdf-datos-vendedor { color: #333333 !important; }
        #espejo-pdf-render .pdf-titulo-documento { color: #000000 !important; }

        .pdf-banner-app {
            background-color: #000000;
            color: #FFFFFF;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 5px solid #7FFF00;
            margin-bottom: 25px;
            border-radius: 4px;
        }

        .pdf-banner-app .marca-txt {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #FFFFFF;
        }

        .pdf-banner-app .marca-txt span {
            color: #7FFF00;
        }

        .pdf-bloque-comercial {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #E5E5E5;
        }

        .pdf-datos-vendedor {
            font-size: 14px;
            line-height: 1.6;
            color: #333333;
        }

        .pdf-logo-comercial {
            max-width: 90px;
            max-height: 90px;
            object-fit: contain;
        }

        .pdf-titulo-documento {
            font-size: 22px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 25px;
            text-transform: uppercase;
            border-left: 6px solid #7FFF00;
            padding-left: 12px;
        }

        .pdf-contenedor-items {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .pdf-fila {
            display: flex;
            align-items: center;
            padding: 14px 8px;
            border-bottom: 1px solid #DCDCDC;
        }

        .pdf-casillero {
            width: 22px;
            height: 22px;
            border: 2px solid #000000;
            margin-right: 15px;
            border-radius: 3px;
            flex-shrink: 0;
            background-color: #FFFFFF;
        }

        .pdf-texto-item {
            font-size: 18px;
            color: #000000;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <h1>Lista x Voz</h1>
        <button class="btn-perfil" onclick="abrirPerfil()" aria-label="Perfil">👤</button>
    </header>

    <div id="indicador-paso">Paso 1: Dictá el Nombre de la Lista</div>

    <div id="contenedor-resultado">
        <div id="header-cliente" style="display: none;">
            <img id="logo-preview" src="" alt="Logo">
            <div id="datos-cliente-texto"></div>
        </div>
        <div id="titulo-lista-actual" style="display: none;"></div>
        <div id="lista-materiales-checklist"></div>
    </div>

    <div id="transcripcion-tiempo-real">Presioná el micrófono para hablar...</div>

    <div class="contenedor-mic">
        <button id="btn-grabar" class="btn-mic" onclick="alternarDictado()">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
            </svg>
        </button>
    </div>

    <button id="btn-pdf" class="btn-accion" onclick="generarPDF()" style="display: none;">
        📄 Descargar Lista en PDF Profesional
    </button>

    <button id="btn-reiniciar" class="btn-accion btn-secundario" onclick="reiniciarFlujo()" style="display: none;">
        Nueva Lista / Borrar Todo
    </button>

    <div style="position: absolute; left: 0; top: 0; width: 100%; height: 0; overflow: hidden; z-index: -1;">
        <div id="espejo-pdf-render">
            <div class="pdf-banner-app">
                <div class="marca-txt">LISTA<span>XVOZ</span></div>
                <div style="font-size: 12px; text-align: right; opacity: 0.9; font-weight: bold; color: #FFFFFF !important;">Documento Comercial de Trabajo</div>
            </div>
            
            <div class="pdf-bloque-comercial">
                <div id="pdf-datos-empresa" class="pdf-datos-vendedor"></div>
                <img id="pdf-logo-empresa" class="pdf-logo-comercial" src="" alt="" style="display: none;">
            </div>

            <div id="pdf-titulo-lista" class="pdf-titulo-documento"></div>
            <div id="pdf-contenedor-items" class="pdf-contenedor-items"></div>
        </div>
    </div>

    <div id="modal-perfil">
        <div class="modal-content">
            <h2>Perfil de Trabajo</h2>
            <div class="form-group">
                <label>Subir Logo Comercial:</label>
                <input type="file" id="p-logo" accept="image/*" onchange="procesarLogo(this)">
            </div>
            <div class="form-group">
                <label>Nombre / Empresa:</label>
                <input type="text" id="p-nombre" placeholder="Ej: Electricidad Oeste">
            </div>
            <div class="form-group">
                <label>📱 Teléfono Celular:</label>
                <input type="tel" id="p-telefono" placeholder="Ej: 11 2345-6789">
            </div>
            <div class="form-group">
                <label>✉️ Mail de contacto:</label>
                <input type="email" id="p-mail" placeholder="contacto@empresa.com">
            </div>
            <div class="form-group">
                <label>📄 ID Fiscal (CUIT / RUT):</label>
                <input type="text" id="p-fiscal" placeholder="Ej: CUIT 20-33333333-7">
            </div>
            <div class="form-group">
                <label>📝 Información Adicional:</label>
                <textarea id="p-adicional" placeholder="Dirección del taller, horarios..."></textarea>
            </div>
            <button class="btn-accion" onclick="guardarPerfil()">Guardar Datos</button>
            <button class="btn-accion btn-secundario" onclick="cerrarPerfil()">Cancelar</button>
        </div>
    </div>

    <script>
        let pasoActual = 1; 
        let nombreLista = "";
        let itemsLista = [];
        let escuchando = false;
        let acumuladoFrase = "";

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let reconocimiento;
        
        if (SpeechRecognition) {
            reconocimiento = new SpeechRecognition();
            reconocimiento.continuous = false; 
            reconocimiento.interimResults = true; 
            reconocimiento.lang = 'es-AR';

            reconocimiento.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        acumuladoFrase = event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                document.getElementById('transcripcion-tiempo-real').innerText = acumuladoFrase || interimTranscript;
            };

            reconocimiento.onend = () => {
                if (escuchando) ejecutarCierreProcesamiento();
            };
        }

        function alternarDictado() {
            if (!reconocimiento) return;
            if (!escuchando) {
                escuchando = true;
                acumuladoFrase = "";
                document.getElementById('btn-grabar').classList.add('escuchando');
                document.getElementById('transcripcion-tiempo-real').innerText = "Escuchando...";
                reconocimiento.start();
            } else {
                ejecutarCierreProcesamiento();
            }
        }

        function ejecutarCierreProcesamiento() {
            escuchando = false;
            document.getElementById('btn-grabar').classList.remove('escuchando');
            if (reconocimiento) reconocimiento.stop();
            
            setTimeout(() => {
                procesarTextoFinal(acumuladoFrase);
                document.getElementById('transcripcion-tiempo-real').innerText = "Presioná el micrófono para hablar...";
            }, 300);
        }

        function procesarTextoFinal(texto) {
            texto = texto.trim();
            if (!texto) return;

            if (pasoActual === 1) {
                nombreLista = texto;
                document.getElementById('titulo-lista-actual').innerText = "📋 LISTA: " + nombreLista.toUpperCase();
                document.getElementById('titulo-lista-actual').style.display = "block";
                pasoActual = 2;
                document.getElementById('indicador-paso').innerText = "Paso 2: Dictá los materiales";
            } else if (pasoActual === 2) {
                let fragmentos = texto.split(/,|\by\b|\btambién\b|\bcon\b/i);
                fragmentos.forEach(f => {
                    let limpio = f.trim();
                    if (limpio.length > 1) {
                        limpio = limpio.charAt(0).toUpperCase() + limpio.slice(1);
                        itemsLista.push(limpio);
                    }
                });
                renderizarListaChecklist();
                document.getElementById('btn-pdf').style.display = "flex";
                document.getElementById('btn-reiniciar').style.display = "flex";
            }
        }

        function renderizarListaChecklist() {
            const contenedor = document.getElementById('lista-materiales-checklist');
            contenedor.innerHTML = ""; 

            itemsLista.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'item-material';

                const divIzq = document.createElement('div');
                divIzq.className = 'item-izq';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `item-${index}`;

                const label = document.createElement('label');
                label.htmlFor = `item-${index}`;
                label.innerText = item;

                divIzq.appendChild(checkbox);
                divIzq.appendChild(label);

                const btnBorrar = document.createElement('button');
                btnBorrar.className = 'btn-borrar-item';
                btnBorrar.innerHTML = '❌';
                btnBorrar.onclick = () => eliminarItem(index);

                div.appendChild(divIzq);
                div.appendChild(btnBorrar);
                contenedor.appendChild(div);
            });
        }

        function eliminarItem(index) {
            itemsLista.splice(index, 1);
            renderizarListaChecklist();
            if(itemsLista.length === 0) {
                document.getElementById('btn-pdf').style.display = "none";
            }
        }

        function generarPDF() {
            const datosEmpresaSrc = document.getElementById('datos-cliente-texto').innerHTML;
            const logoSrc = document.getElementById('logo-preview').src;
            
            document.getElementById('pdf-datos-empresa').innerHTML = datosEmpresaSrc || "<strong>Lista de Materiales</strong>";
            
            const pdfLogo = document.getElementById('pdf-logo-empresa');
            if(logoSrc && !logoSrc.endsWith('index.html') && logoSrc.length > 100) {
                pdfLogo.src = logoSrc;
                pdfLogo.style.display = "block";
            } else {
                pdfLogo.style.display = "none";
            }

            document.getElementById('pdf-titulo-lista').innerText = "Lista: " + nombreLista.toUpperCase();

            const contenedorItemsPDF = document.getElementById('pdf-contenedor-items');
            contenedorItemsPDF.innerHTML = "";

            itemsLista.forEach(item => {
                const fila = document.createElement('div');
                fila.className = 'pdf-fila';
                
                const casillero = document.createElement('div');
                casillero.className = 'pdf-casillero';

                const texto = document.createElement('div');
                texto.className = 'pdf-texto-item';
                texto.innerText = item;

                fila.appendChild(casillero);
                fila.appendChild(texto);
                contenedorItemsPDF.appendChild(fila);
            });

            const elementoPDF = document.getElementById('espejo-pdf-render');

            const opciones = {
                margin:       15,
                filename:     `Lista_${nombreLista.replace(/\s+/g, '_')}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, backgroundColor: '#FFFFFF', useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opciones).from(elementoPDF).save();
        }

        function reiniciarFlujo() {
            if (confirm("¿Querés borrar todo y empezar una nueva lista?")) {
                pasoActual = 1;
                nombreLista = "";
                itemsLista = [];
                document.getElementById('titulo-lista-actual').style.display = "none";
                document.getElementById('lista-materiales-checklist').innerHTML = "";
                document.getElementById('btn-pdf').style.display = "none";
                document.getElementById('btn-reiniciar').style.display = "none";
                document.getElementById('indicador-paso').innerText = "Paso 1: Dictá el Nombre de la Lista";
                acumuladoFrase = "";
            }
        }

        /* --- LOGICA DE PERFIL (LOCALSTORAGE) --- */
        let logoBase64 = "";

        function abrirPerfil() {
            document.getElementById('modal-perfil').style.display = "block";
            document.getElementById('p-nombre').value = localStorage.getItem('p_nombre') || "";
            document.getElementById('p-telefono').value = localStorage.getItem('p_telefono') || "";
            document.getElementById('p-mail').value = localStorage.getItem('p_mail') || "";
            document.getElementById('p-fiscal').value = localStorage.getItem('p_fiscal') || "";
            document.getElementById('p-adicional').value = localStorage.getItem('p_adicional') || "";
            logoBase64 = localStorage.getItem('p_logo') || "";
        }

        function cerrarPerfil() {
            document.getElementById('modal-perfil').style.display = "none";
        }

        function procesarLogo(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    logoBase64 = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function guardarPerfil() {
            localStorage.setItem('p_nombre', document.getElementById('p-nombre').value.trim());
            localStorage.setItem('p_telefono', document.getElementById('p-telefono').value.trim());
            localStorage.setItem('p_mail', document.getElementById('p-mail').value.trim());
            localStorage.setItem('p_fiscal', document.getElementById('p-fiscal').value.trim());
            localStorage.setItem('p_adicional', document.getElementById('p-adicional').value.trim());
            if (logoBase64) localStorage.setItem('p_logo', logoBase64);
            cerrarPerfil();
            cargarEncabezadoPerfilEnPantalla();
        }

        function cargarEncabezadoPerfilEnPantalla() {
            const nombre = localStorage.getItem('p_nombre');
            const telefono = localStorage.getItem('p_telefono');
            const mail = localStorage.getItem('p_mail');
            const fiscal = localStorage.getItem('p_fiscal');
            const adicional = localStorage.getItem('p_adicional');
            const logo = localStorage.getItem('p_logo');

            const divHeader = document.getElementById('header-cliente');
            const divTexto = document.getElementById('datos-cliente-texto');
            const imgLogo = document.getElementById('logo-preview');

            if (nombre || telefono || mail || fiscal || adicional || logo) {
                divHeader.style.display = "flex";
                let HTMLdatos = "";
                if (nombre) HTMLdatos += `<strong>${nombre}</strong><br>`;
                if (telefono) HTMLdatos += `Tel: ${telefono}<br>`;
                if (mail) HTMLdatos += `Msg: ${mail}<br>`;
                if (fiscal) HTMLdatos += `${fiscal}<br>`;
                if (adicional) HTMLdatos += `<small>${adicional}</small>`;
                divTexto.innerHTML = HTMLdatos;

                if (logo) {
                    imgLogo.src = logo;
                    imgLogo.style.display = "block";
                } else {
                    imgLogo.style.display = "none";
                }
            } else {
                divHeader.style.display = "none";
            }
        }

        window.onload = function() {
            cargarEncabezadoPerfilEnPantalla();
        };
    </script>
</body>
</html>
