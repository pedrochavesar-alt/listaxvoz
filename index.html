<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTAXVOZ - Generador Comercial</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --accent-color: #7FFF00; /* Verde Lima Neón */
            --text-color: #FFFFFF;
            --text-muted: #A0A0A0;
            --border-color: #262626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Encabezado Principal */
        header {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border-bottom: 4px solid var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .logo-title span {
            color: var(--accent-color);
        }

        .badge {
            font-size: 11px;
            background-color: #222;
            color: var(--accent-color);
            padding: 5px 10px;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid var(--accent-color);
        }

        /* Tarjetas de Contenedores */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            background-color: #1a1a1a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        /* Bloque editable para datos comerciales */
        .datos-empresa-box {
            background-color: #1a1a1a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            font-size: 15px;
            min-height: 80px;
            border-radius: 6px;
            outline: none;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .datos-empresa-box:focus {
            border-color: var(--accent-color);
        }

        /* Carga dinámica de logotipo empresarial */
        .logo-upload-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-upload {
            background-color: #222;
            border: 1px dashed var(--accent-color);
            color: #fff;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .btn-upload input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
            width: 100%;
        }

        .preview-box {
            width: 65px;
            height: 65px;
            border: 1px solid var(--border-color);
            background-color: #1a1a1a;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Sección de Dictado por Voz Activo */
        .voice-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 25px 20px;
            background: linear-gradient(180deg, #121212 0%, #1a1a1a 100%);
        }

        .mic-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #222;
            border: 3px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 32px;
            user-select: none;
        }

        .mic-button.recording {
            border-color: var(--accent-color);
            background-color: rgba(127, 255, 0, 0.1);
            box-shadow: 0 0 20px rgba(127, 255, 0, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .status-text {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
            text-align: center;
        }

        /* Listado de Materiales Detectados */
        .items-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .item-row {
            background-color: #1a1a1a;
            border-left: 4px solid var(--accent-color);
            padding: 14px 15px;
            border-radius: 0 6px 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .item-text {
            font-size: 16px;
            font-weight: 500;
            word-break: break-word;
            padding-right: 10px;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ff4d4d;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            padding: 0 5px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            padding: 25px 0;
            font-size: 15px;
        }

        /* Disparador de Exportación Comercial */
        .btn-submit {
            background-color: var(--accent-color);
            color: #000000;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(127, 255, 0, 0.2);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #6ed600;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .btn-submit:disabled {
            background-color: #333333;
            color: #777777;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header>
            <div class="logo-title">LISTA<span>XVOZ</span></div>
            <div class="badge">SISTEMA DE PRESUPUESTOS</div>
        </header>

        <div class="card">
            <div class="form-group">
                <label for="nombre-lista-input">Nombre o Título de la Lista</label>
                <input type="text" id="nombre-lista-input" placeholder="Ej: Baño Principal, Materiales Electricidad">
            </div>

            <div class="form-group">
                <label>Datos Comerciales de la Empresa / Profesional</label>
                <div id="datos-cliente-texto" class="datos-empresa-box" contenteditable="true" placeholder="Escribí acá tu Nombre, Teléfono, Email o Info del Cliente..."></div>
            </div>

            <div class="form-group">
                <label>Logotipo del Documento</label>
                <div class="logo-upload-section">
                    <div class="btn-upload">
                        Subir Imagen Logo
                        <input type="file" id="logo-input" accept="image/*">
                    </div>
                    <div class="preview-box">
                        <img id="logo-preview" src="" alt="">
                    </div>
                </div>
            </div>
        </div>

        <div class="card voice-section">
            <div class="mic-button" id="mic-btn">🎤</div>
            <div class="status-text" id="status-text">Micrófono inactivo. Presioná para dictar un material.</div>
        </div>

        <div class="card">
            <label>Materiales e Ítems Registrados</label>
            <div class="items-container" id="items-container">
                <div class="empty-state">No hay ítems en la lista todavía. Dictá usando el micrófono.</div>
            </div>
        </div>

        <button class="btn-submit" id="btn-pdf" disabled onclick="generarPDF()">Generar PDF Comercial</button>

    </div>

    <script>
        // --- CONTROLADOR DE ESTADO GLOBAL ---
        let nombreLista = '';
        let itemsLista = [];

        const nombreListaInput = document.getElementById('nombre-lista-input');
        const datosClienteTexto = document.getElementById('datos-cliente-texto');
        const logoInput = document.getElementById('logo-input');
        const logoPreview = document.getElementById('logo-preview');
        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('status-text');
        const itemsContainer = document.getElementById('items-container');
        const btnPdf = document.getElementById('btn-pdf');

        // Sincronización del Nombre de la Lista
        nombreListaInput.addEventListener('input', (e) => {
            nombreLista = e.target.value.trim();
            actualizarEstadoBoton();
        });

        // Procesamiento en Base64 seguro para inyección de Logotipos en PDF
        logoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    logoPreview.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Actualización de UI del listado en pantalla
        function renderItems() {
            itemsContainer.innerHTML = '';
            
            if (itemsLista.length === 0) {
                itemsContainer.innerHTML = '<div class="empty-state">No hay ítems en la lista todavía. Dictá usando el micrófono.</div>';
                actualizarEstadoBoton();
                return;
            }

            itemsLista.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <span class="item-text">${item}</span>
                    <button class="btn-delete" onclick="eliminarItem(${index})">✕</button>
                `;
                itemsContainer.appendChild(row);
            });

            actualizarEstadoBoton();
        }

        function eliminarItem(index) {
            itemsLista.splice(index, 1);
            renderItems();
        }

        function actualizarEstadoBoton() {
            if (nombreLista && itemsLista.length > 0) {
                btnPdf.removeAttribute('disabled');
            } else {
                btnPdf.setAttribute('disabled', 'true');
            }
        }

        // --- SISTEMA DE DICTADO POR VOZ INTEGRADO (OPTIMIZADO) ---
        if ('webkitSpeechRecognition' in window || 'speechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-AR';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                micBtn.classList.add('recording');
                statusText.innerText = 'Escuchando activo... Dictá un material ahora';
            };

            recognition.onend = () => {
                micBtn.classList.remove('recording');
                statusText.innerText = 'Micrófono inactivo. Presioná para volver a dictar';
            };

            recognition.onresult = (event) => {
                const texto = event.results[0][0].transcript.trim();
                if (texto) {
                    // Formateo estético inmediato (Primera letra Mayúscula)
                    const textoFormateado = texto.charAt(0).toUpperCase() + texto.slice(1);
                    itemsLista.push(textoFormateado);
                    renderItems();
                }
            };

            recognition.onerror = (event) => {
                console.error("Error capturado en Speech API: ", event.error);
                statusText.innerText = 'Error al procesar voz. Volvé a intentar.';
                micBtn.classList.remove('recording');
            };

            micBtn.addEventListener('click', () => {
                if (micBtn.classList.contains('recording')) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            });
        } else {
            statusText.innerText = 'Reconocimiento de voz no soportado de forma nativa por este navegador.';
            micBtn.style.opacity = '0.4';
            micBtn.style.cursor = 'not-allowed';
        }

        // --- GENERACIÓN DE PDF COMERCIAL BLINDADA CONTRA HOJAS BLANCAS ---
        function generarPDF() {
            if (!nombreLista || itemsLista.length === 0) return;

            // 1. Desactivar temporalmente el scroll animado para que no cause retrasos en la foto del lienzo
            const estiloScrollOriginal = document.documentElement.style.scrollBehavior;
            document.documentElement.style.scrollBehavior = 'auto';

            // 2. Guardar la posición exacta del usuario y forzar salto instantáneo al top absoluto (0,0)
            const posicionXOriginal = window.scrollX;
            const posicionYOriginal = window.scrollY;
            window.scrollTo(0, 0);

            // 3. Cartel de bloqueo estético de renderizado
            const cargando = document.createElement('div');
            cargando.style.position = 'fixed';
            cargando.style.top = '0';
            cargando.style.left = '0';
            cargando.style.width = '100vw';
            cargando.style.height = '100vh';
            cargando.style.backgroundColor = 'rgba(0, 0, 0, 0.95)';
            cargando.style.color = '#7FFF00';
            cargando.style.zIndex = '9999';
            cargando.style.display = 'flex';
            cargando.style.flexDirection = 'column';
            cargando.style.justifyContent = 'center';
            cargando.style.alignItems = 'center';
            cargando.style.fontFamily = 'Arial, sans-serif';
            cargando.innerHTML = `
                <div style="font-size: 24px; font-weight: bold; margin-bottom: 10px;">Generando PDF Comercial...</div>
                <div style="font-size: 16px; color: #FFFFFF;">Por favor, esperá un momento.</div>
            `;
            document.body.appendChild(cargando);

            const datosEmpresaSrc = datosClienteTexto.innerHTML;
            const logoSrc = logoPreview.src;
            
            // 4. Contenedor temporal aislado montado arriba del DOM para asegurar renders perfectos
            const pdfContainer = document.createElement('div');
            pdfContainer.style.position = 'absolute';
            pdfContainer.style.top = '0';
            pdfContainer.style.left = '0';
            pdfContainer.style.width = '750px'; 
            pdfContainer.style.zIndex = '9000'; 
            pdfContainer.style.backgroundColor = '#FFFFFF';
            pdfContainer.style.color = '#000000';
            pdfContainer.style.padding = '40px';
            pdfContainer.style.boxSizing = 'border-box';

            let itemsHTML = '';
            itemsLista.forEach(item => {
                itemsHTML += `
                    <div style="display: flex; align-items: center; padding: 14px 10px; border-bottom: 1px solid #E0E0E0; page-break-inside: avoid;">
                        <div style="width: 18px; height: 18px; border: 2px solid #000000; margin-right: 15px; border-radius: 3px; background-color: #FFFFFF; flex-shrink: 0;"></div>
                        <div style="font-size: 17px; color: #000000; font-weight: 500; word-break: break-word;">${item}</div>
                    </div>
                `;
            });

            let logoHTML = '';
            if(logoSrc && !logoSrc.endsWith('index.html') && logoSrc.length > 100) {
                logoHTML = `<img src="${logoSrc}" style="max-width: 100px; max-height: 100px; object-fit: contain; border-radius: 5px;">`;
            }

            pdfContainer.innerHTML = `
                <div style="background-color: #000000; color: #FFFFFF; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 5px solid #7FFF00; margin-bottom: 30px; border-radius: 4px;">
                    <div style="font-size: 28px; font-weight: bold; letter-spacing: 0.5px;">LISTA<span style="color: #7FFF00;">XVOZ</span></div>
                    <div style="font-size: 11px; text-align: right; font-weight: bold; color: #7FFF00;">DOCUMENTO COMERCIAL DE TRABAJO</div>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 35px; padding-bottom: 20px; border-bottom: 2px solid #F0F0F0;">
                    <div style="font-size: 15px; line-height: 1.6; color: #333333;">${datosEmpresaSrc || "<span style='color:#999; font-style:italic;'>Lista de Materiales</span>"}</div>
                    <div>${logoHTML}</div>
                </div>

                <div style="font-size: 24px; font-weight: bold; color: #000000; margin-bottom: 30px; text-transform: uppercase; border-left: 6px solid #7FFF00; padding-left: 14px;">
                    Lista: ${nombreLista.toUpperCase()}
                </div>
                
                <div style="display: flex; flex-direction: column; width: 100%;">
                    ${itemsHTML}
                </div>

                <div style="margin-top: 60px; text-align: center; font-size: 11px; color: #888888; border-top: 1px solid #E5E5E5; padding-top: 15px;">
                    Generado automáticamente mediante la aplicación Lista x Voz
                </div>
            `;
            
            document.body.appendChild(pdfContainer);

            // Ajustes técnicos avanzados para la captura de html2pdf
            const opciones = {
                margin:       15,
                filename:     `Lista_${nombreLista.replace(/\s+/g, '_')}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { 
                    scale: 2, 
                    backgroundColor: '#FFFFFF', 
                    useCORS: true, 
                    logging: false,
                    scrollY: 0,
                    scrollX: 0
                },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // 5. Retraso de renderizado controlado para dar holgura al motor del navegador antes de disparar la descarga
            setTimeout(() => {
                html2pdf().set(opciones).from(pdfContainer).save().then(() => {
                    // Limpieza absoluta y devolución del scroll a la experiencia del usuario
                    document.body.removeChild(pdfContainer);
                    document.body.removeChild(cargando);
                    window.scrollTo(posicionXOriginal, posicionYOriginal);
                    document.documentElement.style.scrollBehavior = estiloScrollOriginal;
                }).catch(err => {
                    console.error("Error crítico de exportación PDF: ", err);
                    document.body.removeChild(pdfContainer);
                    document.body.removeChild(cargando);
                    window.scrollTo(posicionXOriginal, posicionYOriginal);
                    document.documentElement.style.scrollBehavior = estiloScrollOriginal;
                });
            }, 350);
        }
    </script>
</body>
</html>
