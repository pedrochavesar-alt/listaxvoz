<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Presu x Voz</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* --- ESTILOS DE ALTO CONTRASTE PARA TRABAJO DE CAMPO (NARANJA Y NEGRO) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #FFFFFF;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #FF6B00;
            padding-bottom: 10px;
        }

        h1 {
            font-size: 28px;
            color: #FFFFFF;
            font-weight: bold;
        }
        h1 span {
            color: #FF6B00;
        }

        /* --- PERFIL DE USUARIO --- */
        .btn-perfil {
            background: none;
            border: none;
            font-size: 32px;
            cursor: pointer;
            padding: 5px;
        }

        #modal-perfil {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.98);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            border: 3px solid #FF6B00;
            padding: 20px;
            border-radius: 10px;
            background-color: #111111;
        }

        .modal-content h2 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #FF6B00;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            background-color: #222222;
            border: 2px solid #FFFFFF;
            color: #FFFFFF;
            border-radius: 5px;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #FF6B00;
            outline: none;
        }

        .form-group textarea {
            height: 100px;
            resize: none;
        }

        /* --- CONTENEDOR DE LA HOJA EN PANTALLA --- */
        #contenedor-resultado {
            background-color: #111111;
            border: 2px solid #222222;
            border-radius: 8px;
            padding: 15px;
            flex-grow: 1;
            margin-bottom: 15px;
        }

        #header-cliente {
            margin-bottom: 20px;
            font-size: 16px;
            line-height: 1.4;
            border-left: 4px solid #FF6B00;
            padding-left: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #logo-preview {
            max-width: 70px;
            max-height: 70px;
            object-fit: contain;
            border-radius: 5px;
            display: none;
        }

        #indicador-paso {
            font-size: 18px;
            color: #FF6B00;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #titulo-lista-actual {
            font-size: 22px;
            text-align: center;
            margin-bottom: 15px;
            color: #FFFFFF;
            border-bottom: 1px dashed #444444;
            padding-bottom: 5px;
            font-weight: bold;
        }

        /* --- CHECKLIST EN VIVO --- */
        .item-material {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 10px 5px;
            border-bottom: 1px solid #222222;
        }

        .item-izq {
            display: flex;
            align-items: center;
            flex-grow: 1;
        }

        .item-material input[type="checkbox"] {
            width: 28px;
            height: 28px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: #FF6B00;
            flex-shrink: 0;
        }

        .item-material label {
            font-size: 20px;
            color: #FFFFFF;
            cursor: pointer;
            word-break: break-word;
        }

        .item-material input[type="checkbox"]:checked + label {
            text-decoration: line-through;
            color: #666666;
        }

        .btn-borrar-item {
            background: none;
            border: none;
            color: #FF3B30;
            font-size: 22px;
            padding: 5px 10px;
            cursor: pointer;
            margin-left: 10px;
        }

        /* --- AJUSTE MANUAL COMPLEMENTARIO --- */
        #bloque-manual {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        #input-manual {
            flex-grow: 1;
            padding: 12px;
            font-size: 16px;
            background-color: #111111;
            border: 2px solid #444444;
            color: #FFFFFF;
            border-radius: 6px;
        }

        #input-manual:focus {
            border-color: #FF6B00;
            outline: none;
        }

        .btn-add-manual {
            background-color: #333333;
            color: #FFFFFF;
            border: 2px solid #555555;
            padding: 0 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        /* --- MONITOR Y CONTROL DE AUDIO --- */
        #transcripcion-tiempo-real {
            font-size: 18px;
            color: #A0A0A0;
            font-style: italic;
            text-align: center;
            min-height: 45px;
            margin-bottom: 10px;
            padding: 5px 10px;
        }

        .contenedor-mic {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0 20px 0;
        }

        .btn-mic {
            background-color: #FF6B00;
            border: none;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 107, 0, 0.4);
        }

        .btn-mic.escuchando {
            background-color: #FF3B30;
            animation: pulso 1.2s infinite;
        }

        .btn-mic svg {
            width: 45px;
            height: 45px;
            fill: #000000;
        }

        .btn-mic.escuchando svg {
            fill: #FFFFFF;
        }

        @keyframes pulso {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        /* --- BOTONES DE ACCIÓN --- */
        .btn-accion {
            background-color: #FF6B00;
            color: #000000;
            font-size: 20px;
            font-weight: bold;
            border: none;
            padding: 18px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-secundario {
            background-color: transparent;
            border: 2px solid #FFFFFF;
            color: #FFFFFF;
            margin-top: 15px;
            padding: 12px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Presu<span>xVoz</span></h1>
        <button class="btn-perfil" onclick="abrirPerfil()" aria-label="Perfil">👤</button>
    </header>

    <div id="indicador-paso">Paso 1: Dictá el Nombre del Ambiente o Lista</div>

    <div id="contenedor-resultado">
        <div id="header-cliente" style="display: none;">
            <img id="logo-preview" src="" alt="Logo">
            <div id="datos-cliente-texto"></div>
        </div>
        <div id="titulo-lista-actual" style="display: none;"></div>
        <div id="lista-materiales-checklist"></div>
    </div>

    <div id="bloque-manual" style="display: none;">
        <input type="text" id="input-manual" placeholder="Escribí un material si falló la voz...">
        <button class="btn-add-manual" onclick="agregarItemManual()">+</button>
    </div>

    <div id="transcripcion-tiempo-real">Presioná el micrófono naranja para hablar...</div>

    <div class="contenedor-mic">
        <button id="btn-grabar" class="btn-mic" onclick="alternarDictado()">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
            </svg>
        </button>
    </div>

    <button id="btn-pdf" class="btn-accion" onclick="generarPDF()" style="display: none;">
        📄 Descargar Lista en PDF Profesional
    </button>

    <button id="btn-reiniciar" class="btn-accion btn-secundario" onclick="reiniciarFlujo()" style="display: none;">
        Nueva Lista / Borrar Todo
    </button>

    <div id="modal-perfil">
        <div class="modal-content">
            <h2>Perfil de Trabajo</h2>
            <div class="form-group">
                <label>Subir Logo Comercial:</label>
                <input type="file" id="p-logo" accept="image/*" onchange="procesarLogo(this)">
            </div>
            <div class="form-group">
                <label>Nombre / Empresa:</label>
                <input type="text" id="p-nombre" placeholder="Ej: Constructora Escorpion">
            </div>
            <div class="form-group">
                <label>📱 Teléfono Celular:</label>
                <input type="tel" id="p-telefono" placeholder="Ej: 11 2345-6789">
            </div>
            <div class="form-group">
                <label>✉️ Mail de contacto:</label>
                <input type="email" id="p-mail" placeholder="contacto@empresa.com">
            </div>
            <div class="form-group">
                <label>📄 ID Fiscal (CUIT / RUT):</label>
                <input type="text" id="p-fiscal" placeholder="Ej: CUIT 20-33333333-7">
            </div>
            <div class="form-group">
                <label>📝 Información Adicional:</label>
                <textarea id="p-adicional" placeholder="Dirección, horarios o notas adicionales..."></textarea>
            </div>
            <button class="btn-accion" onclick="guardarPerfil()">Guardar Datos</button>
            <button class="btn-accion btn-secundario" onclick="cerrarPerfil()">Cancelar</button>
        </div>
    </div>

    <script>
        let pasoActual = 1; 
        let nombreLista = "";
        let itemsLista = [];
        let escuchando = false;
        let acumuladoFrase = "";

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let reconocimiento;
        
        if (SpeechRecognition) {
            reconocimiento = new SpeechRecognition();
            reconocimiento.continuous = true; // CAMBIO CRÍTICO: Mantiene abierto el mic para evitar cortes y duplicaciones
            reconocimiento.interimResults = true; 
            reconocimiento.lang = 'es-AR';

            reconocimiento.onresult = (event) => {
                let textFinal = '';
                let textInterim = '';
                
                // Recorremos todos los fragmentos desde el inicio de la sesión para armar la frase limpia
                for (let i = 0; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        textFinal += event.results[i][0].transcript + ' ';
                    } else {
                        textInterim += event.results[i][0].transcript;
                    }
                }
                acumuladoFrase = textFinal.trim();
                document.getElementById('transcripcion-tiempo-real').innerText = textFinal + textInterim || "Escuchando...";
            };

            reconocimiento.onend = () => {
                // Al cerrarse el reconocimiento de forma segura, procesamos el texto limpio definitivo
                if (acumuladoFrase.trim()) {
                    procesarTextoFinal(acumuladoFrase);
                }
                acumuladoFrase = "";
                escuchando = false;
                document.getElementById('btn-grabar').classList.remove('escuchando');
                document.getElementById('transcripcion-tiempo-real').innerText = "Presioná el micrófono naranja para hablar...";
            };
        }

        function alternarDictado() {
            if (!reconocimiento) {
                alert("Este navegador no soporta el reconocimiento de voz nativo.");
                return;
            }
            if (!escuchando) {
                escuchando = true;
                acumuladoFrase = "";
                document.getElementById('btn-grabar').classList.add('escuchando');
                document.getElementById('transcripcion-tiempo-real').innerText = "Escuchando... Hablá ahora de corrido.";
                reconocimiento.start();
            } else {
                reconocimiento.stop(); // Detiene de forma segura y gatilla el flujo limpio en onend
            }
        }

        function procesarTextoFinal(texto) {
            texto = texto.trim();
            if (!texto) return;

            if (pasoActual === 1) {
                nombreLista = texto;
                document.getElementById('titulo-lista-actual').innerText = "📋 " + nombreLista.toUpperCase();
                document.getElementById('titulo-lista-actual').style.display = "block";
                pasoActual = 2;
                document.getElementById('indicador-paso').innerText = "Paso 2: Dictá los materiales separados por comas o pausas";
                document.getElementById('bloque-manual').style.display = "flex";
            } else if (pasoActual === 2) {
                let fragmentos = texto.split(/,|\by\b|\btambién\b|\bcon\b/i);
                fragmentos.forEach(f => {
                    let limpio = f.trim();
                    if (limpio.length > 1) {
                        limpio = limpio.charAt(0).toUpperCase() + limpio.slice(1);
                        // Evitamos duplicar items idénticos en la misma tanda
                        if(!itemsLista.includes(limpio)) {
                            itemsLista.push(limpio);
                        }
                    }
                });
                renderizarListaChecklist();
                document.getElementById('btn-pdf').style.display = "flex";
                document.getElementById('btn-reiniciar').style.display = "flex";
            }
        }

        function renderizarListaChecklist() {
            const contenedor = document.getElementById('lista-materiales-checklist');
            contenedor.innerHTML = ""; 

            itemsLista.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'item-material';

                const divIzq = document.createElement('div');
                divIzq.className = 'item-izq';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `item-${index}`;

                const label = document.createElement('label');
                label.htmlFor = `item-${index}`;
                label.innerText = item;

                divIzq.appendChild(checkbox);
                divIzq.appendChild(label);

                const btnBorrar = document.createElement('button');
                btnBorrar.className = 'btn-borrar-item';
                btnBorrar.innerHTML = '❌';
                btnBorrar.onclick = () => eliminarItem(index);

                div.appendChild(divIzq);
                div.appendChild(btnBorrar);
                contenedor.appendChild(div);
            });
        }

        function agregarItemManual() {
            const input = document.getElementById('input-manual');
            let valor = input.value.trim();
            if(valor.length > 1) {
                valor = valor.charAt(0).toUpperCase() + valor.slice(1);
                itemsLista.push(valor);
                renderizarListaChecklist();
                input.value = "";
                document.getElementById('btn-pdf').style.display = "flex";
                document.getElementById('btn-reiniciar').style.display = "flex";
            }
        }

        function eliminarItem(index) {
            itemsLista.splice(index, 1);
            renderizarListaChecklist();
            if(itemsLista.length === 0) {
                document.getElementById('btn-pdf').style.display = "none";
            }
        }

        /* --- SOLUCIÓN DE RENDIMIENTO PDF DEFINITIVA DESDE MEMORIA DETACHED --- */
        function generarPDF() {
            const datosEmpresaSrc = document.getElementById('datos-cliente-texto').innerHTML;
            const logoSrc = document.getElementById('logo-preview').src;
            
            // Creamos el nodo del PDF completamente aislado en memoria para saltearnos fallas de layouts del CSS padre
            const pdfContainer = document.createElement('div');
            pdfContainer.style.position = 'absolute';
            pdfContainer.style.left = '-9999px';
            pdfContainer.style.top = '0';
            pdfContainer.style.width = '794px'; // Ancho A4 exacto de renderizado
            pdfContainer.style.backgroundColor = '#FFFFFF';
            pdfContainer.style.color = '#000000';
            pdfContainer.style.padding = '40px';
            pdfContainer.style.boxSizing = 'border-box';
            pdfContainer.style.fontFamily = 'Arial, sans-serif';

            // Armamos el HTML interno con estilos en línea nativos e inalterables
            let itemsHTML = '';
            itemsLista.forEach(item => {
                itemsHTML += `
                    <div style="display: flex; align-items: center; padding: 14px 8px; border-bottom: 1px solid #DCDCDC;">
                        <div style="width: 22px; height: 22px; border: 2px solid #000000; margin-right: 15px; border-radius: 3px; background-color: #FFFFFF; flex-shrink:0;"></div>
                        <div style="font-size: 18px; color: #000000; font-weight: 500;">${item}</div>
                    </div>
                `;
            });

            let logoHTML = '';
            if(logoSrc && !logoSrc.endsWith('listaxvoz.html') && logoSrc.length > 100) {
                logoHTML = `<img src="${logoSrc}" style="max-width: 90px; max-height: 90px; object-fit: contain;">`;
            }

            pdfContainer.innerHTML = `
                <div style="background-color: #000000; color: #FFFFFF; padding: 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 5px solid #FF6B00; margin-bottom: 25px; border-radius: 4px;">
                    <div style="font-size: 28px; font-weight: bold; letter-spacing: 1px; color: #FFFFFF !important;">PRESU<span style="color: #FF6B00;">XVOZ</span></div>
                    <div style="font-size: 12px; text-align: right; font-weight: bold; color: #FFFFFF !important;">Documento Comercial de Trabajo</div>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid #E5E5E5;">
                    <div style="font-size: 14px; line-height: 1.6; color: #333333 !important;">${datosEmpresaSrc || "<strong>Lista de Materiales</strong>"}</div>
                    <div>${logoHTML}</div>
                </div>

                <div style="font-size: 22px; font-weight: bold; color: #000000 !important; margin-bottom: 25px; text-transform: uppercase; border-left: 6px solid #FF6B00; padding-left: 12px;">Lista: ${nombreLista.toUpperCase()}</div>
                
                <div style="display: flex; flex-direction: column; width: 100%;">
                    ${itemsHTML}
                </div>
            `;
            
            // Lo inyectamos al body vivo para que html2canvas mida correctamente su altura física real
            document.body.appendChild(pdfContainer);

            const opciones = {
                margin:       12,
                filename:     `Lista_${nombreLista.replace(/\s+/g, '_')}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, backgroundColor: '#FFFFFF', useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // Ejecutamos la descarga y limpiamos la memoria inmediatamente
            html2pdf().set(opciones).from(pdfContainer).save().then(() => {
                document.body.removeChild(pdfContainer);
            });
        }

        function reiniciarFlujo() {
            if (confirm("¿Querés borrar todo y empezar una nueva lista?")) {
                pasoActual = 1;
                nombreLista = "";
                itemsLista = [];
                document.getElementById('titulo-lista-actual').style.display = "none";
                document.getElementById('lista-materiales-checklist').innerHTML = "";
                document.getElementById('btn-pdf').style.display = "none";
                document.getElementById('btn-reiniciar').style.display = "none";
                document.getElementById('bloque-manual').style.display = "none";
                document.getElementById('indicador-paso').innerText = "Paso 1: Dictá el Nombre del Ambiente o Lista";
                acumuladoFrase = "";
            }
        }

        /* --- LOGICA DE PERFIL (LOCALSTORAGE) --- */
        let logoBase64 = "";

        function abrirPerfil() {
            document.getElementById('modal-perfil').style.display = "block";
            document.getElementById('p-nombre').value = localStorage.getItem('p_nombre') || "";
            document.getElementById('p-telefono').value = localStorage.getItem('p_telefono') || "";
            document.getElementById('p-mail').value = localStorage.getItem('p_mail') || "";
            document.getElementById('p-fiscal').value = localStorage.getItem('p_fiscal') || "";
            document.getElementById('p-adicional').value = localStorage.getItem('p_adicional') || "";
            logoBase64 = localStorage.getItem('p_logo') || "";
        }

        function cerrarPerfil() {
            document.getElementById('modal-perfil').style.display = "none";
        }

        function procesarLogo(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    logoBase64 = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function guardarPerfil() {
            localStorage.setItem('p_nombre', document.getElementById('p-nombre').value.trim());
            localStorage.setItem('p_telefono', document.getElementById('p-telefono').value.trim());
            localStorage.setItem('p_mail', document.getElementById('p-mail').value.trim());
            localStorage.setItem('p_fiscal', document.getElementById('p-fiscal').value.trim());
            localStorage.setItem('p_adicional', document.getElementById('p-adicional').value.trim());
            if (logoBase64) localStorage.setItem('p_logo', logoBase64);
            cerrarPerfil();
            cargarEncabezadoPerfilEnPantalla();
        }

        function cargarEncabezadoPerfilEnPantalla() {
            const nombre = localStorage.getItem('p_nombre');
            const telefono = localStorage.getItem('p_telefono');
            const mail = localStorage.getItem('p_mail');
            const fiscal = localStorage.getItem('p_fiscal');
            const adicional = localStorage.getItem('p_adicional');
            const logo = localStorage.getItem('p_logo');

            const divHeader = document.getElementById('header-cliente');
            const divTexto = document.getElementById('datos-cliente-texto');
            const imgLogo = document.getElementById('logo-preview');

            if (nombre || telefono || mail || fiscal || adicional || logo) {
                divHeader.style.display = "flex";
                let HTMLdatos = "";
                if (nombre) HTMLdatos += `<strong>${nombre}</strong><br>`;
                if (telefono) HTMLdatos += `Tel: ${telefono}<br>`;
                if (mail) HTMLdatos += `Contacto: ${mail}<br>`;
                if (fiscal) HTMLdatos += `${fiscal}<br>`;
                if (adicional) HTMLdatos += `<small>${adicional}</small>`;
                divTexto.innerHTML = HTMLdatos;

                if (logo) {
                    imgLogo.src = logo;
                    imgLogo.style.display = "block";
                } else {
                    imgLogo.style.display = "none";
                }
            } else {
                divHeader.style.display = "none";
            }
        }

        window.onload = function() {
            cargarEncabezadoPerfilEnPantalla();
        };
    </script>
</body>
</html>
