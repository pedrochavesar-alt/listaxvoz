<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Lista x Voz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700;900&display=swap');

  :root {
    --green: #7FFF00;
    --green-dark: #5fcc00;
    --green-dim: rgba(127,255,0,0.15);
    --bg: #000000;
    --surface: #111111;
    --surface2: #1a1a1a;
    --white: #ffffff;
    --gray: #888888;
    --red: #ff4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    overflow-x: hidden;
    overscroll-behavior: none;
  }

  #app-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg);
    border-bottom: 2px solid var(--green);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #app-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: var(--green);
    letter-spacing: 2px;
    line-height: 1;
  }

  #app-subtitle {
    font-size: 11px;
    color: var(--gray);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  #profile-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 2.5px solid var(--green);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    cursor: pointer;
    flex-shrink: 0;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  #profile-btn:active { background: var(--green-dim); }
  #profile-btn img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

  #main {
    padding: 20px 16px 120px;
    max-width: 600px;
    margin: 0 auto;
  }

  .step-card {
    background: var(--surface);
    border: 1.5px solid #333;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .step-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 8px;
  }

  .step-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--white);
    margin-bottom: 16px;
    line-height: 1.2;
  }

  .transcript-box {
    background: var(--surface2);
    border: 1.5px solid #333;
    border-radius: 12px;
    padding: 16px;
    min-height: 60px;
    font-size: 20px;
    color: var(--white);
    line-height: 1.4;
    margin-bottom: 16px;
    word-break: break-word;
    transition: border-color 0.3s;
  }
  .transcript-box.listening {
    border-color: var(--green);
    animation: pulse-border 1s infinite;
  }
  .transcript-box .placeholder {
    color: var(--gray);
    font-style: italic;
  }

  @keyframes pulse-border {
    0%,100% { border-color: var(--green); box-shadow: 0 0 0 0 rgba(127,255,0,0.4); }
    50% { border-color: var(--green); box-shadow: 0 0 0 6px rgba(127,255,0,0); }
  }

  .mic-btn {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: none;
    background: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
    position: relative;
  }
  .mic-btn:active { transform: scale(0.93); }
  .mic-btn.listening {
    background: var(--red);
    animation: mic-pulse 1s infinite;
  }
  .mic-btn svg { width: 44px; height: 44px; }

  @keyframes mic-pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,68,68,0.5); }
    50% { box-shadow: 0 0 0 18px rgba(255,68,68,0); }
  }

  .mic-hint {
    text-align: center;
    font-size: 13px;
    color: var(--gray);
    margin-bottom: 12px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 18px;
    border-radius: 14px;
    border: none;
    font-family: 'Barlow', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-green { background: var(--green); color: #000; }
  .btn-outline { background: transparent; color: var(--green); border: 2px solid var(--green); }
  .btn-outline:active { background: var(--green-dim); }
  .btn-small { padding: 12px 18px; font-size: 15px; border-radius: 10px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .btn-row .btn { flex: 1; }

  #list-section { display: none; }
  #list-section.visible { display: block; }

  .list-header-block {
    background: var(--surface);
    border: 1.5px solid #333;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
  }

  #list-name-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--green);
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  #profile-header {
    font-size: 13px;
    color: var(--gray);
    line-height: 1.6;
    display: none;
  }
  #profile-header.has-data { display: block; }

  #profile-logo-display {
    width: 60px;
    height: 60px;
    border-radius: 10px;
    object-fit: cover;
    margin-bottom: 10px;
    display: none;
  }
  #profile-logo-display.visible { display: block; }

  #checklist {
    list-style: none;
    margin-bottom: 16px;
  }

  #checklist li {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid #222;
    font-size: 18px;
    line-height: 1.4;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  #checklist li:last-child { border-bottom: none; }
  #checklist li.checked { opacity: 0.5; text-decoration: line-through; color: var(--gray); }

  .check-box {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 2.5px solid var(--green);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    transition: background 0.15s;
  }
  li.checked .check-box { background: var(--green); }
  .check-box svg { display: none; }
  li.checked .check-box svg { display: block; }

  #status-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid #222;
    padding: 10px 16px;
    font-size: 13px;
    color: var(--gray);
    text-align: center;
    z-index: 40;
  }
  #status-bar.active { color: var(--green); }

  #profile-modal {
    display: none;
    position: fixed;
    inset: 0;
