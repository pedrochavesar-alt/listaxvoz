<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lista x Voz</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* --- ESTILOS DE ALTO CONTRASTE PARA CAMPO --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #FFFFFF;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #7FFF00;
            padding-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            color: #FFFFFF;
            font-weight: bold;
        }

        /* --- PERFIL DE USUARIO --- */
        .btn-perfil {
            background: none;
            border: none;
            font-size: 32px;
            cursor: pointer;
            padding: 5px;
        }

        #modal-perfil {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.98);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            border: 3px solid #7FFF00;
            padding: 20px;
            border-radius: 10px;
            background-color: #111111;
        }

        .modal-content h2 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #7FFF00;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            background-color: #222222;
            border: 2px solid #FFFFFF;
            color: #FFFFFF;
            border-radius: 5px;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #7FFF00;
            outline: none;
        }

        .form-group textarea {
            height: 100px;
            resize: none;
        }

        /* --- CONTENEDOR DE LA HOJA EN PANTALLA --- */
        #contenedor-resultado {
            background-color: #111111;
            border: 2px solid #333333;
            border-radius: 8px;
            padding: 15px;
            flex-grow: 1;
            margin-bottom: 20px;
        }

        /* Encabezado del documento en pantalla */
        #header-cliente {
            margin-bottom: 20px;
            font-size: 16px;
            line-height: 1.4;
            border-left: 4px solid #7FFF00;
            padding-left: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #logo-preview {
            max-width: 70px;
            max-height: 70px;
            object-fit: contain;
            border-radius: 5px;
            display: none;
        }

        #indicador-paso {
            font-size: 20px;
            color: #7FFF00;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
        }

        #titulo-lista-actual {
            font-size: 24px;
            text-align: center;
            margin-bottom: 15px;
            color: #FFFFFF;
            border-bottom: 1px dashed #555555;
            padding-bottom: 5px;
            font-weight: bold;
        }

        /* --- FILAS DE MATERIALES --- */
        .item-material {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 8px 5px;
            border-bottom: 1px solid #222222;
        }

        .item-izq {
            display: flex;
            align-items: center;
            flex-grow: 1;
        }

        .item-material input[type="checkbox"] {
            width: 28px;
            height: 28px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: #7FFF00;
            flex-shrink: 0;
        }

        .item-material label {
            font-size: 20px;
            color: #FFFFFF;
            cursor: pointer;
            word-break: break-word;
        }

        .item-material input[type="checkbox"]:checked + label {
            text-decoration: line-through;
            color: #666666;
        }

        .btn-borrar-item {
            background: none;
            border: none;
            color: #FF3B30;
            font-size: 22px;
            padding: 5px 10px;
            cursor: pointer;
            margin-left: 10px;
        }

        /* --- CONTROLES DE AUDIO --- */
        .contenedor-mic {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
        }

        .btn-mic {
            background-color: #7FFF00;
            border: none;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(127, 255, 0, 0.4);
        }

        .btn-mic.escuchando {
            background-color: #FF3B30;
            animation: pulso 1.2s infinite;
        }

        .btn-mic svg {
            width: 50px;
            height: 50px;
            fill: #000000;
        }

        .btn-mic.escuchando svg {
            fill: #FFFFFF;
        }

        @keyframes pulso {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        #transcripcion-tiempo-real {
            font-size: 20px;
            color: #A0A0A0;
            font-style: italic;
            text-align: center;
            min-height: 45px;
            margin-bottom: 15px;
            padding: 5px 10px;
        }

        /* --- BOTONES DE ACCIÓN --- */
        .btn-accion {
            background-color: #7FFF00;
            color: #000000;
            font-size: 20px;
            font-weight: bold;
            border: none;
            padding: 18px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-secundario {
            background-color: transparent;
            border: 2px solid #FFFFFF;
            color: #FFFFFF;
            margin-top: 15px;
            padding: 12px;
            font-size: 16px;
        }

        /* --- 📄 TRUCO TÉCNICO: MAQUETA DE PDF EN COORDENADAS NEGATIVAS (INVISIBLE AL OJO, REAL PARA EL MOTOR) --- */
        #espejo-pdf-render {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 700px;
            background-color: #FFFFFF !important;
            color: #000000 !important;
            padding: 30px;
            font-family: Arial, sans-serif;
        }

        .pdf-banner-app {
            background-color: #000000;
            color: #FFFFFF;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 5px solid #7FFF00;
            margin-bottom: 25px;
            border-radius: 4px;
        }

        .pdf-banner-app .marca-txt {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .pdf-banner-app .marca-txt span {
            color: #7FFF00;
        }

        .pdf-bloque-comercial {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #E5E5E5;
        }

        .pdf-datos-vendedor {
            font-size: 14px;
            line-height: 1.6;
            color: #333333;
        }

        .pdf-logo-comercial {
            max-width: 90px;
            max-height: 90px;
            object-fit: contain;
        }

        .pdf-titulo-documento {
            font-size: 22px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 25px;
            text-transform: uppercase;
            border-left: 6px solid #7FFF00;
            padding-left: 12px;
        }

        .pdf-contenedor-items {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .pdf-fila {
            display: flex;
            align-items: center;
            padding: 14px 8px;
            border-bottom: 1px solid #DCDCDC;
        }

        .pdf-casillero {
            width: 22px;
            height: 22px;
            border: 2px solid #000000;
            margin-right: 15px;
            border-radius: 3px;
            flex-shrink: 0;
            background-color: #FFFFFF;
        }

        .pdf-texto-item {
            font-size: 18px;
            color: #000000;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <h1>Lista x Voz</h1>
        <button class="btn-perfil" onclick="abrirPerfil()" aria-label="Perfil">👤</button>
    </header>

    <div id="indicador-paso">Paso 1: Dictá el Nombre de la Lista</div>

    <div id="contenedor-resultado">
        <div id="header-cliente" style="display: none;">
            <img id="logo-preview" src="" alt="Logo">
            <div id="datos-cliente-texto"></div>
        </div>
        <div id="titulo-lista-actual" style="display: none;"></div>
        <div id="lista-materiales-checklist"></div>
    </div>

    <div id="transcripcion-tiempo-real">Presioná el micrófono para hablar...</div>

    <div class="contenedor-mic">
        <button id="btn-grabar" class="btn-mic" onclick="alternarDictado()">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
            </svg>
        </button>
    </div>

    <button id="btn-pdf" class="btn-accion" onclick="generarPDF()" style="display: none;">
        📄 Descargar Lista en PDF Profesional
    </button>

    <button id="btn-reiniciar" class="btn-accion btn-secundario" onclick="reiniciarFlujo()" style="display: none;">
        Nueva Lista / Borrar Todo
    </button>

    <div id="espejo-pdf-render">
        <div class="pdf-banner-app">
            <div class="marca-txt">LISTA<span>XVOZ</span></div>
            <div style="font-size: 12px; text-align: right; opacity: 0.9; font-weight: bold;">Documento Comercial de Trabajo</div>
        </div>
        
        <div class="pdf-bloque-comercial">
            <div id="pdf-datos-empresa" class="pdf-datos-vendedor"></div>
            <img id="pdf-logo-empresa" class="pdf-logo-comercial" src="" alt="" style="display: none;">
        </div>

        <div id="pdf-titulo-lista" class="pdf-titulo-documento"></div>
        <div id="pdf-contenedor-items" class="pdf-contenedor-items"></div>
    </div>

    <div id="modal-perfil">
        <div class="modal-content">
            <h2>Perfil de Trabajo</h2>
            <div class="form-group">
                <label>Subir Logo Comercial:</label>
                <input type="file" id="p-logo" accept="image/*" onchange="procesarLogo(this)">
            </div>
            <div class="form-group">
                <label>Nombre / Empresa:</label>
                <input type="text" id="p-nombre" placeholder="Ej: Electricidad Oeste">
            </div>
            <div class="form-group">
                <label>📱 Teléfono Celular:</label>
                <input type="tel" id="p-telefono" placeholder="Ej: 11 2345-6789">
            </div>
            <div class="form-group">
                <label>✉️ Mail de contacto:</label>
                <input type="email" id="p-mail" placeholder="contacto@empresa.com">
            </div>
            <div class="form-group">
                <label>📄 ID Fiscal (CUIT / RUT):</label>
                <input type="text" id="p-fiscal" placeholder="Ej: CUIT 20-33333333-7">
            </div>
            <div class="form-group">
                <label>📝 Información Adicional:</label>
                <textarea id="p-adicional" placeholder="Dirección del taller, horarios..."></textarea>
            </div>
            <button class="btn-accion" onclick="guardarPerfil()">Guardar Datos</button>
            <button class="btn-accion btn-secundario" onclick="cerrarPerfil()">Cancelar</button>
        </div>
    </div>

    <script>
        let pasoActual = 1; 
        let nombreLista = "";
        let itemsLista = [];
        let escuchando = false;
        let acumuladoFrase = "";

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let reconocimiento;
        
        if (SpeechRecognition) {
            reconocimiento = new SpeechRecognition();
            reconocimiento.continuous = false; 
            reconocimiento.interimResults = true; 
            reconocimiento.lang = 'es-AR';

            reconocimiento.onresult
